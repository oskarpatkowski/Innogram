# docker-compose.yml

services:
  core:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "${CORE_PORT}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_NAME}:${POSTGRES_PASSWD}@db:5432/${POSTGRES_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
        
  auth:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "${AUTH_PORT}:3002"
    environment:
      NODE_ENV: production

  client:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "${CLIENT_PORT}:3001"
    environment:
      NODE_ENV: production
  
  db:
    env_file: ".env"
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWD}
      POSTGRES_USER: ${POSTGRES_NAME}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NAME} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: