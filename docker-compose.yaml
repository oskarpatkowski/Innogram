services:
  prisma-setup:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    working_dir: /app/packages/database
    command: npx prisma db push
    environment:
      DATABASE_URL: postgresql://${POSTGRES_NAME}:${POSTGRES_PASSWD}@db:5432/${POSTGRES_NAME}
    depends_on:
      db:
        condition: service_healthy

  core:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_NAME}:${POSTGRES_PASSWD}@db:5432/${POSTGRES_NAME}
      AUTH_SERVICE_URL: "http://auth:${AUTH_PORT}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      prisma-setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules

  client:
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      PORT: ${CLIENT_PORT}
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules

  db:
    env_file: ".env"
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWD}
      POSTGRES_USER: ${POSTGRES_NAME}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_NAME} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    user: "root"
    env_file: ".env"
    build:
      context: .
      dockerfile: apps/auth_microservice/Dockerfile
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    environment:
      NODE_ENV: development
      ALLOWED_ORIGIN: "http://localhost:${CORE_PORT}"
      DATABASE_URL: postgresql://${POSTGRES_NAME}:${POSTGRES_PASSWD}@db:5432/${POSTGRES_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      npm_config_cache: /tmp/.npm
    working_dir: /app/apps/auth_microservice
    command: npx --yes tsx watch src/main.ts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      prisma-setup:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
